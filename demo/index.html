<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@audio/wam · gain + compressor demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-weight: 500; }
  h2 { font-weight: 500; font-size: 1rem; margin: 0; opacity: .7; }
  fieldset { border: 1px solid #ccc; padding: .75rem 1.25rem 1rem; margin-bottom: 1rem; }
  legend { font-weight: 500; padding: 0 .25rem; }
  label { display: flex; align-items: center; gap: 1rem; margin: .5rem 0; }
  label > span:first-child { min-width: 6rem; }
  input[type="range"] { flex: 1; }
  output { font-variant-numeric: tabular-nums; min-width: 4em; text-align: right; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  select { font: inherit; padding: .15rem .25rem; }
  pre { background: #f4f4f4; padding: .75rem; border-radius: 4px; overflow-x: auto; font-size: .85rem; }
  details { margin-top: 1.5rem; }
</style>
</head>
<body>
<h1>@audio/wam</h1>
<p>Factory functions from <code>examples/</code>, wrapped via <code>toWam</code>, chained as AudioWorklets under a 440 Hz sine source.</p>

<fieldset>
  <legend>Transport</legend>
  <button id="toggle">Start</button>
</fieldset>

<fieldset>
  <legend>Gain</legend>
  <label><span>Value (dB)</span><input type="range" id="g_value" min="-60" max="6" step="0.5" value="-6"><output id="g_value_out">-6</output></label>
</fieldset>

<fieldset>
  <legend>Compressor</legend>
  <label><span>Threshold (dB)</span><input type="range" id="c_threshold" min="-60" max="0" step="0.5" value="-20"><output id="c_threshold_out">-20</output></label>
  <label><span>Ratio</span><input type="range" id="c_ratio" min="1" max="20" step="0.1" value="4"><output id="c_ratio_out">4</output></label>
  <label><span>Attack (s)</span><input type="range" id="c_attack" min="0.001" max="0.2" step="0.001" value="0.01"><output id="c_attack_out">0.010</output></label>
  <label><span>Release (s)</span><input type="range" id="c_release" min="0.01" max="2" step="0.01" value="0.1"><output id="c_release_out">0.10</output></label>
  <label><span>Knee</span>
    <select id="c_knee">
      <option value="soft" selected>soft</option>
      <option value="hard">hard</option>
    </select>
  </label>
  <label><span>Auto makeup</span><input type="checkbox" id="c_auto"></label>
</fieldset>

<details>
  <summary>Descriptors</summary>
  <h2>gain</h2>
  <pre id="gain_descriptor"></pre>
  <h2>compressor</h2>
  <pre id="comp_descriptor"></pre>
</details>

<script type="module">
import { toWam } from '../wam.js'
import { gain } from '../examples/gain.js'
import { compressor } from '../examples/compressor.js'

// `url` lets the worklet import the real module — module-scope helpers survive
// (function serialization would lose them).
const gainWam = toWam(gain, { url: new URL('../examples/gain.js', location.href).href })
const compWam = toWam(compressor, { url: new URL('../examples/compressor.js', location.href).href })
document.getElementById('gain_descriptor').textContent = JSON.stringify(gainWam.descriptor, null, 2)
document.getElementById('comp_descriptor').textContent = JSON.stringify(compWam.descriptor, null, 2)

let ctx, source, gainNode, compNode, playing = false

const $ = (id) => document.getElementById(id)
const setOut = (id, v) => { const o = $(id + '_out'); if (o) o.textContent = v }

const initialCompParams = () => ({
  threshold: +$('c_threshold').value,
  ratio:     +$('c_ratio').value,
  attack:    +$('c_attack').value,
  release:   +$('c_release').value,
  knee:      $('c_knee').value,
  auto:      $('c_auto').checked
})

// Gain — sample-accurate AudioParam with a short ramp, no zipper.
$('g_value').addEventListener('input', (e) => {
  setOut('g_value', e.target.value)
  if (!gainNode) return
  const p = gainNode.parameters.get('value')
  p.cancelScheduledValues(ctx.currentTime)
  p.setTargetAtTime(+e.target.value, ctx.currentTime, 0.02)
})

// Compressor numeric params — k-rate AudioParam, scheduled with a short ramp.
const wireNumeric = (id, paramName) => {
  $(id).addEventListener('input', (e) => {
    const v = +e.target.value
    setOut(id, paramName === 'attack' || paramName === 'release' ? v.toFixed(3) : v)
    if (!compNode) return
    const p = compNode.parameters.get(paramName)
    p.cancelScheduledValues(ctx.currentTime)
    p.setTargetAtTime(v, ctx.currentTime, 0.02)
  })
}
wireNumeric('c_threshold', 'threshold')
wireNumeric('c_ratio',     'ratio')
wireNumeric('c_attack',    'attack')
wireNumeric('c_release',   'release')

// Compressor non-numeric params — MessagePort updates.
$('c_knee').addEventListener('change', (e) => compNode?.setParam('knee', e.target.value))
$('c_auto').addEventListener('change', (e) => compNode?.setParam('auto', e.target.checked))

$('toggle').addEventListener('click', async () => {
  if (!playing) {
    ctx ??= new AudioContext()
    if (!compNode) {
      await Promise.all([gainWam.register(ctx), compWam.register(ctx)])
      gainNode = gainWam.create(ctx, { parameterData: { value: +$('g_value').value } })
      compNode = compWam.create(ctx, { parameterData: initialCompParams() })
      source = ctx.createOscillator()
      source.frequency.value = 440
      source.connect(gainNode).connect(compNode).connect(ctx.destination)
      source.start()
    }
    await ctx.resume()
    $('toggle').textContent = 'Stop'
    playing = true
  } else {
    await ctx.suspend()
    $('toggle').textContent = 'Start'
    playing = false
  }
})
</script>
</body>
</html>
